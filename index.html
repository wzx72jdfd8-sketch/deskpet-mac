<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Deskpet" />
    <meta name="theme-color" content="#2f6b3a" />
    <title>Deskpet</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <style>
      :root {
        --pitch: #2f6b3a;
        --line: rgba(255, 255, 255, 0.22);
        --ink: #f4efe4;
        --safe-b: env(safe-area-inset-bottom, 0px);
        --safe-t: env(safe-area-inset-top, 0px);
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body {
        margin: 0; height: 100%; height: 100dvh;
        background: var(--pitch); color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        overflow: hidden; overscroll-behavior: none;
        user-select: none; -webkit-user-select: none;
      }
      #stage {
        position: fixed; inset: 0; z-index: 0; pointer-events: none;
        background:
          linear-gradient(180deg, rgba(0,0,0,.12), transparent 18%),
          repeating-linear-gradient(90deg, #2f6b3a 0 48px, #347441 48px 96px);
      }
      #stage::before {
        content: ""; position: absolute; inset: 12% 10% 22%;
        border: 2px solid var(--line); border-radius: 8px; pointer-events: none;
      }
      #pet {
        position: absolute; left: 24px; top: auto; bottom: 96px;
        width: 148px; height: 148px;
        transform-origin: center bottom;
        z-index: 3;
        pointer-events: auto;
      }
      #sprite {
        width: 100%; height: 100%;
        object-fit: contain; object-position: bottom center;
        pointer-events: none;
        filter: drop-shadow(0 10px 8px rgba(0,0,0,.28));
      }
      #bar {
        position: fixed; left: 10px; right: 10px;
        bottom: calc(10px + var(--safe-b));
        z-index: 20; display: flex; flex-wrap: wrap; gap: 6px;
        justify-content: center;
        overflow: visible;
        padding: 8px; border-radius: 18px;
        background: rgba(16, 28, 18, .88);
        backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
        pointer-events: auto;
      }
      #bar button {
        flex: 0 0 auto; min-height: 44px; min-width: 56px; padding: 0 14px; border: 0;
        border-radius: 12px; background: transparent; color: var(--ink);
        font: 600 14px/1 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        touch-action: manipulation;
        cursor: pointer;
      }
      #bar button.on { background: #f4efe4; color: #16341c; }
      #hint {
        position: fixed; top: calc(14px + var(--safe-t));
        left: 16px; right: 16px; text-align: center; font-size: 13px;
        color: rgba(255,255,255,.9); text-shadow: 0 1px 8px rgba(0,0,0,.45);
        pointer-events: none; z-index: 4; transition: opacity .6s;
      }
      #hint.gone { opacity: 0; }
      #add {
        position: fixed; top: calc(44px + var(--safe-t));
        left: 16px; right: 16px; text-align: center; font-size: 12px;
        color: rgba(255,255,255,.7); pointer-events: none; z-index: 4;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="pet">
      <img id="sprite" alt="Deskpet" src="https://raw.githubusercontent.com/wzx72jdfd8-sketch/deskpet-mac/main/pet/idle.png" />
    </div>
    <p id="hint">Deskpet · Sit and Sleep stay put. Drag him. Tap to jump.</p>
    <p id="add">Share → Add to Home Screen for a full-screen pet</p>
    <nav id="bar" aria-label="Deskpet">
      <button type="button" data-mode="walk" class="on" onclick="Deskpet.go('walk')">Walk</button>
      <button type="button" data-mode="run" onclick="Deskpet.go('run')">Run</button>
      <button type="button" data-mode="follow" onclick="Deskpet.go('follow')">Follow</button>
      <button type="button" data-mode="sit" onclick="Deskpet.go('sit')">Sit</button>
      <button type="button" data-mode="sleep" onclick="Deskpet.go('sleep')">Sleep</button>
      <button type="button" data-mode="dance" onclick="Deskpet.go('dance')">Dance</button>
      <button type="button" data-mode="jump" onclick="Deskpet.go('jump')">Jump</button>
    </nav>
    <script>
(function () {
  window.Deskpet = { go: function () {} };
  var CDN = "https://cdn.jsdelivr.net/gh/wzx72jdfd8-sketch/deskpet-mac@af017df/pet/";
  var RAW = "https://raw.githubusercontent.com/wzx72jdfd8-sketch/deskpet-mac/main/pet/";
  function petSrc(name) { return RAW + name; }

  var petEl = document.getElementById("pet");
  var sprite = document.getElementById("sprite");
  var hint = document.getElementById("hint");
  sprite.onerror = function () {
    var name = sprite.getAttribute("data-name") || "idle.png";
    if (sprite.src.indexOf("jsdelivr") < 0) sprite.src = CDN + name;
  };

  var walk = ["walk-1.png", "walk-2.png", "walk-3.png", "walk-4.png"];
  var frames = {
    idle: ["idle.png"],
    walk: walk,
    run: ["run-1.png", "walk-2.png", "run-1.png", "walk-4.png"],
    sit: ["sit.png"],
    sleep: ["sleep.png"],
    dance: ["dance.png", "idle.png"],
    jump: ["jump.png"]
  };

  var mode = "walk", anim = "walk", facing = 1;
  var x = 24, y = 0, vx = 90, size = 148;
  var frame = 0, frameT = 0, phase = 0;
  var held = false, jumping = 0, last = 0;
  var finger = { x: 80, y: 200 };
  var think = 1.5, sitT = 0, started = false;

  function viewW() { return Math.max(window.innerWidth, document.documentElement.clientWidth, 320); }
  function viewH() { return Math.max(window.innerHeight, document.documentElement.clientHeight, 480); }
  function dock() {
    var bar = document.getElementById("bar");
    var h = bar ? bar.offsetHeight : 56;
    return h + 24 + (window.visualViewport ? 0 : 0);
  }
  function maxX() { return Math.max(8, viewW() - size); }
  function maxY() { return Math.max(8, viewH() - size - dock()); }
  function ground() { return maxY(); }

  function showFrame() {
    var list = frames[anim] || frames.idle;
    var name = list[frame % list.length];
    var url = petSrc(name);
    sprite.setAttribute("data-name", name);
    if (sprite.getAttribute("src") !== url) sprite.src = url;
  }

  function layout() {
    var bob = 0;
    if (anim === "walk" || anim === "run") bob = Math.sin(phase * 2) * (anim === "run" ? 5 : 3);
    else if (anim === "dance") bob = Math.abs(Math.sin(phase * 2)) * 10;
    var jy = 0;
    if (jumping > 0) {
      var u = jumping;
      jy = -110 * 4 * u * (1 - u);
    }
    petEl.style.left = "0px";
    petEl.style.top = "0px";
    petEl.style.bottom = "auto";
    petEl.style.width = size + "px";
    petEl.style.height = size + "px";
    petEl.style.transform = "translate(" + Math.round(x) + "px," + Math.round(y + bob + jy) + "px) scaleX(" + facing + ")";
    showFrame();
  }

  function setMode(next) {
    mode = next;
    jumping = 0;
    sitT = 0;
    if (next === "walk" || next === "run") {
      anim = next;
      y = ground();
      vx = (facing > 0 ? 1 : -1) * (next === "run" ? 160 : 90);
    } else if (next === "sit") {
      anim = "sit";
      sitT = 1e9;
    } else if (next === "sleep") {
      anim = "sleep";
      sitT = 1e9;
    } else if (next === "dance") anim = "dance";
    else if (next === "follow") anim = "walk";
    frame = 0;
    var btns = document.querySelectorAll("[data-mode]");
    for (var i = 0; i < btns.length; i++) btns[i].classList.toggle("on", btns[i].getAttribute("data-mode") === mode);
    layout();
  }

  function jump() {
    if (held) return;
    jumping = 0.01;
    anim = "jump";
    frame = 0;
  }

  function tick(now) {
    if (!last) last = now;
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;

    if (mode === "sit" || mode === "sleep") {
      jumping = 0;
      anim = mode;
      phase += dt * 0.6;
      layout();
      requestAnimationFrame(tick);
      return;
    }

    phase += dt * (anim === "run" ? 8.5 : anim === "dance" ? 7 : 5.6);
    frameT += dt;
    var fps = anim === "walk" || anim === "run" ? 8 : anim === "dance" ? 4 : 2;
    while (frameT >= 1 / fps) { frameT -= 1 / fps; frame++; }

    if (jumping > 0) {
      jumping += dt / 0.55;
      if (jumping >= 1) {
        jumping = 0;
        anim = mode === "run" ? "run" : mode === "sit" ? "sit" : mode === "sleep" ? "sleep" : mode === "dance" ? "dance" : "walk";
      }
    } else if (!held) {
      if (mode === "walk" || mode === "run") {
        x += vx * dt;
        y = ground();
        if (x < 0) { x = 0; vx = Math.abs(vx); facing = 1; }
        if (x > maxX()) { x = maxX(); vx = -Math.abs(vx); facing = -1; }
        think -= dt;
        if (mode === "walk" && think <= 0) {
          think = 2 + Math.random() * 3;
          if (Math.random() < 0.12) jump();
        }
      } else if (mode === "follow") {
        var tx = finger.x - size / 2, ty = finger.y - size * 0.7;
        var dx = tx - x, dy = ty - y;
        var dist = Math.sqrt(dx * dx + dy * dy);
        if (dist > 8) {
          anim = dist > 180 ? "run" : "walk";
          facing = dx >= 0 ? 1 : -1;
          var sp = (anim === "run" ? 220 : 130) * dt;
          if (sp > dist) sp = dist;
          x += (dx / dist) * sp;
          y += (dy / dist) * sp;
        } else anim = "idle";
      } else if (mode === "dance") anim = "dance";
    }

    x = Math.max(0, Math.min(maxX(), x));
    y = Math.max(0, Math.min(maxY(), y));
    layout();
    requestAnimationFrame(tick);
  }

  var drag = { dx: 0, dy: 0, moved: false };
  function down(ev) {
    ev.preventDefault();
    ev.stopPropagation();
    held = true;
    drag.moved = false;
    var t = ev.touches ? ev.touches[0] : ev;
    drag.dx = t.clientX - x;
    drag.dy = t.clientY - y;
    if (mode !== "sit" && mode !== "sleep") anim = "idle";
  }
  function move(ev) {
    var t = ev.touches ? ev.touches[0] : ev;
    finger.x = t.clientX; finger.y = t.clientY;
    if (!held) return;
    ev.preventDefault();
    var nx = t.clientX - drag.dx, ny = t.clientY - drag.dy;
    if (Math.abs(nx - x) + Math.abs(ny - y) > 4) drag.moved = true;
    x = nx; y = ny;
    layout();
  }
  function up(ev) {
    if (!held) return;
    held = false;
    if (mode === "sit" || mode === "sleep") {
      layout();
      return;
    }
    if (!drag.moved) jump();
    else if (mode === "walk" || mode === "run") y = ground();
  }
  petEl.addEventListener("touchstart", down, { passive: false });
  petEl.addEventListener("mousedown", down);
  petEl.addEventListener("touchmove", move, { passive: false });
  petEl.addEventListener("mousemove", move);
  petEl.addEventListener("touchend", up);
  petEl.addEventListener("mouseup", up);
  petEl.addEventListener("mouseleave", up);

  var lastGo = 0;
  window.Deskpet.go = function (m) {
    var now = Date.now();
    if (now - lastGo < 280) return;
    lastGo = now;
    if (m === "jump") jump();
    else setMode(m);
  };
  var btns = document.querySelectorAll("[data-mode]");
  for (var i = 0; i < btns.length; i++) {
    btns[i].addEventListener("click", function (ev) {
      ev.preventDefault();
      window.Deskpet.go(ev.currentTarget.getAttribute("data-mode"));
    });
    btns[i].addEventListener("touchend", function (ev) {
      ev.preventDefault();
      ev.stopPropagation();
      window.Deskpet.go(ev.currentTarget.getAttribute("data-mode"));
    }, { passive: false });
  }

  ["idle.png","walk-1.png","walk-2.png","walk-3.png","walk-4.png","run-1.png","sit.png","sleep.png","dance.png","jump.png"].forEach(function (n) {
    var im = new Image();
    im.src = petSrc(n);
  });

  window.addEventListener("touchmove", function (ev) {
    var t = ev.touches && ev.touches[0];
    if (t) { finger.x = t.clientX; finger.y = t.clientY; }
  }, { passive: true });
  window.addEventListener("mousemove", function (ev) {
    finger.x = ev.clientX; finger.y = ev.clientY;
  });
    x = Math.max(0, Math.min(maxX(), x));
    if (mode === "walk" || mode === "run") y = ground();
    layout();
  });

  function start() {
    if (started) return;
    started = true;
    y = ground();
    x = Math.min(40, maxX());
    setMode("walk");
    layout();
    requestAnimationFrame(tick);
    setTimeout(function () { if (hint) hint.classList.add("gone"); }, 4000);
    var nav = window.navigator;
    if (nav.standalone || window.matchMedia("(display-mode: standalone)").matches) {
      var add = document.getElementById("add");
      if (add) add.style.display = "none";
    }
  }
  start();
})();
    </script>
  </body>
</html>
