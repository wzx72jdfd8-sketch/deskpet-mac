<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Deskpet" />
    <meta name="theme-color" content="#2f6b3a" />
    <title>Deskpet</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <style>
      :root {
        --pitch: #2f6b3a;
        --line: rgba(255, 255, 255, 0.22);
        --ink: #f4efe4;
        --safe-b: env(safe-area-inset-bottom, 0px);
        --safe-t: env(safe-area-inset-top, 0px);
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        touch-action: none;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--pitch);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
        overflow: hidden;
        overscroll-behavior: none;
        user-select: none;
        -webkit-user-select: none;
      }
      #stage {
        position: fixed;
        inset: 0;
        background:
          linear-gradient(180deg, rgba(0, 0, 0, 0.12), transparent 18%),
          repeating-linear-gradient(
            90deg,
            #2f6b3a 0 48px,
            #347441 48px 96px
          );
      }
      #stage::before {
        content: "";
        position: absolute;
        inset: 12% 10% 22%;
        border: 2px solid var(--line);
        border-radius: 8px;
        pointer-events: none;
      }
      #stage::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 12%;
        bottom: 22%;
        width: 2px;
        margin-left: -1px;
        background: var(--line);
        pointer-events: none;
      }
      #pet {
        position: absolute;
        left: 0;
        top: 0;
        will-change: transform;
        transform-origin: center bottom;
      }
      #sprite {
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: bottom center;
        pointer-events: none;
        filter: drop-shadow(0 10px 8px rgba(0, 0, 0, 0.28));
      }
      #bar {
        position: fixed;
        left: 10px;
        right: 10px;
        bottom: calc(10px + var(--safe-b));
        z-index: 5;
        display: flex;
        gap: 6px;
        overflow-x: auto;
        padding: 8px;
        border-radius: 18px;
        background: rgba(16, 28, 18, 0.72);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        touch-action: pan-x;
        -webkit-overflow-scrolling: touch;
      }
      #bar button {
        flex: 0 0 auto;
        min-height: 44px;
        padding: 0 14px;
        border: 0;
        border-radius: 12px;
        background: transparent;
        color: var(--ink);
        font: 600 14px/1 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        touch-action: manipulation;
      }
      #bar button.on {
        background: #f4efe4;
        color: #16341c;
      }
      #hint {
        position: fixed;
        top: calc(14px + var(--safe-t));
        left: 16px;
        right: 16px;
        text-align: center;
        font-size: 13px;
        letter-spacing: 0.02em;
        color: rgba(255, 255, 255, 0.88);
        text-shadow: 0 1px 8px rgba(0, 0, 0, 0.45);
        pointer-events: none;
        transition: opacity 0.6s;
      }
      #hint.gone {
        opacity: 0;
      }
      #add {
        position: fixed;
        top: calc(44px + var(--safe-t));
        left: 16px;
        right: 16px;
        text-align: center;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.7);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="pet">
        <img id="sprite" src="https://cdn.jsdelivr.net/gh/wzx72jdfd8-sketch/deskpet-mac@af017df/pet/idle.png" alt="Deskpet" />
      </div>
    </div>
    <p id="hint">Drag him. Tap to jump. Buttons along the bottom.</p>
    <p id="add">Share → Add to Home Screen for a full-screen pet</p>
    <nav id="bar" aria-label="Deskpet">
      <button type="button" data-mode="walk" class="on">Walk</button>
      <button type="button" data-mode="run">Run</button>
      <button type="button" data-mode="follow">Follow</button>
      <button type="button" data-mode="sit">Sit</button>
      <button type="button" data-mode="sleep">Sleep</button>
      <button type="button" data-mode="dance">Dance</button>
      <button type="button" data-mode="jump">Jump</button>
    </nav>
    <script src="https://cdn.jsdelivr.net/gh/wzx72jdfd8-sketch/deskpet-mac@af017df/deskpet.js"></script>
  </body>
</html>
